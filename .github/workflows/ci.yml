name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Interrupting an FTP sync can leave the remote manifest ahead of the uploaded files.
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Get latest code
        uses: actions/checkout@v7

      - name: 📦 Get pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: ⬇️ Get Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint and type-check
        run: pnpm lint

      - name: 🧪 Test
        run: pnpm test

      - name: 🏗️ Build production server
        run: pnpm build

      - name: 📄 Render static FTP entry
        run: pnpm prerender:static

      - name: ⬆️ Upload FTP
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.output/public/
          server-dir: ./
          # The previous manifest was left inconsistent by an interrupted deployment.
          state-name: .ftp-deploy-sync-state-tanstack.json
