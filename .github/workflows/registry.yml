name: Registry consumers

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [vite, next, tanstack]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:test ${{ matrix.framework }}
